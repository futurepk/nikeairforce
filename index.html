<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nike Air Force 1 — Bootstrap exercise</title>

    <!-- Bootstrap eerst; eigen CSS daarna. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

    <link

  <body class="test">
    <!-- Schrijf hier zelf de HTML van de pagina. -->

    <nav class="navbar navbar-shoes navbar-expand-lg fw-bold py-0">
      <div class="container-fluid border-bottom px-0">
        <a
          class="navbar-brand d-flex align-items-center justify-content-center m-0"
          href="#"
          ><img
            class="img-fluid"
            src="img/nike-logo.png"
            alt=""
            width="64"
            height="32"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">

            <li class="nav-item">

            <li class="nav-item">

            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">CUSTOMIZE</a>
            </li>
          </ul>
          <div class="rounded-pill">
            <form
              class="d-flex border border-1 border-secondary rounded-pill align-items-center px-2 me-3"
              role="search"
            >
              <i
                class="bi bi-search fw-bold"
                style="font-weight: 900 !important"
              ></i>
              <input
                class="form-control me-2 border-0"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
            </form>
          </div>

      </div>

    <main></main>
